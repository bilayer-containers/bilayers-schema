name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Schema unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Python version and all dependencies come from pyproject.toml + pixi.lock,
      # so builds are reproducible and there is no pinned Python here.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          locked: true
          cache: true

      - name: Run tests
        run: pixi run -e dev pytest tests/ -v
