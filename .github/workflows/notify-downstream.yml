name: Notify downstream repos of schema change

on:
    pull_request:
        branches:
            - main
        types:
            - closed

# Since the job below never uses GITHUB_TOKEN (repository-dispatch auth comes from REPO_TRIGGER_TOKEN)
# we've removed the default permission. In future, if we add a step that uses GITHUB_TOKEN, we should explicitly add the required permissions to that step.
permissions: {}

jobs:
    notify:
        name: Notify ${{ matrix.repo }} of schema change
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        strategy:
            matrix:
                repo: [bilayers-algorithms, bilayers-targets]
        steps:
            - name: Notify ${{ matrix.repo }} of schema change
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4.0.1
              with:
                  token: ${{ secrets.REPO_TRIGGER_TOKEN }}
                  repository: bilayer-containers/${{ matrix.repo }}
                  event-type: schema-updated
                  client-payload: '{"pr_number": "${{ github.event.pull_request.number }}", "schema_commit_sha": "${{ github.event.pull_request.merge_commit_sha }}"}'